<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía de Inmigración</title>
<meta name="description" content="Chatbot de ayuda para inmigrantes y refugiados en España. Información sobre NIE, TIE, permisos de trabajo, sanidad y más.">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3250;
    --text: #e8eaf6;
    --text2: #9095b0;
    --accent: #5c6bc0;
    --accent2: #7986cb;
    --accent-light: rgba(92,107,192,0.15);
    --user-bg: #3949ab;
    --bot-bg: #1a1d27;
    --btn: #2e3250;
    --btn-hover: #3a4070;
    --shadow: 0 4px 24px rgba(0,0,0,0.5);
    --radius: 16px;
    --radius-sm: 10px;
    --success: #4caf50;
    --warn: #ff9800;
  }
  [data-theme="light"] {
    --bg: #f0f2ff;
    --surface: #fff;
    --surface2: #e8ebff;
    --border: #c5cae9;
    --text: #1a237e;
    --text2: #5c6bc0;
    --accent: #3f51b5;
    --accent2: #5c6bc0;
    --accent-light: rgba(63,81,181,0.1);
    --user-bg: #3f51b5;
    --bot-bg: #fff;
    --btn: #e8ebff;
    --btn-hover: #d8ddff;
    --shadow: 0 4px 24px rgba(63,81,181,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
  .logo{display:flex;align-items:center;gap:10px}
  .logo svg{width:32px;height:32px;flex-shrink:0}
  .logo-text h1{font-size:1rem;font-weight:700;color:var(--text);line-height:1.2}
  .logo-text p{font-size:0.7rem;color:var(--text2)}
  .header-controls{display:flex;align-items:center;gap:8px}
  .lang-selector{display:flex;gap:4px;background:var(--surface2);border-radius:20px;padding:3px}
  .lang-btn{border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:0.75rem;font-weight:600;padding:4px 10px;border-radius:16px;transition:all 0.2s}
  .lang-btn.active{background:var(--accent);color:#fff}
  .lang-btn:hover:not(.active){background:var(--btn-hover);color:var(--text)}
  .theme-btn{border:none;background:var(--btn);color:var(--text2);cursor:pointer;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all 0.2s}
  .theme-btn:hover{background:var(--btn-hover);color:var(--text)}
  .chat-wrap{flex:1;display:flex;flex-direction:column;max-width:720px;margin:0 auto;width:100%;padding:16px 12px 0}
  .messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:16px}
  .messages::-webkit-scrollbar{width:4px}
  .messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .msg{max-width:88%;display:flex;flex-direction:column;gap:4px}
  .msg.user{align-self:flex-end;align-items:flex-end}
  .msg.bot{align-self:flex-start;align-items:flex-start}
  .bubble{padding:12px 16px;border-radius:var(--radius);line-height:1.6;font-size:0.92rem}
  .msg.user .bubble{background:var(--user-bg);color:#fff;border-bottom-right-radius:4px}
  .msg.bot .bubble{background:var(--bot-bg);border:1px solid var(--border);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
  .bubble b{font-weight:700}
  .bubble ul{margin:8px 0 4px 18px;display:flex;flex-direction:column;gap:3px}
  .bubble a{color:var(--accent2);text-decoration:none;border-bottom:1px solid transparent;transition:border-color 0.2s}
  .bubble a:hover{border-bottom-color:var(--accent2)}
  .bubble .tag{display:inline-block;background:var(--accent-light);color:var(--accent2);font-size:0.72rem;font-weight:600;padding:2px 8px;border-radius:10px;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
  .quick-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .qbtn{border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:0.82rem;padding:7px 14px;border-radius:20px;transition:all 0.2s;text-align:left}
  .qbtn:hover{background:var(--accent-light);border-color:var(--accent2);color:var(--accent2)}
  .qbtn.cat{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;padding:10px 18px;font-size:0.88rem}
  .qbtn.cat:hover{background:var(--accent2);border-color:var(--accent2)}
  .card-links{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .card-link{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--btn);border-radius:var(--radius-sm);color:var(--text);text-decoration:none;font-size:0.85rem;transition:all 0.2s;border:1px solid transparent}
  .card-link:hover{background:var(--accent-light);border-color:var(--accent2);color:var(--accent2)}
  .card-link svg{width:16px;height:16px;flex-shrink:0}
  .input-area{background:var(--surface);border-top:1px solid var(--border);padding:12px;position:sticky;bottom:0}
  .input-wrap{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
  .input-box{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;color:var(--text);font-size:0.92rem;font-family:inherit;resize:none;min-height:48px;max-height:140px;line-height:1.5;outline:none;transition:border-color 0.2s}
  .input-box:focus{border-color:var(--accent)}
  .input-box::placeholder{color:var(--text2)}
  .send-btn,.mic-btn{border:none;cursor:pointer;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s}
  .send-btn{background:var(--accent);color:#fff}
  .send-btn:hover{background:var(--accent2)}
  .mic-btn{background:var(--btn);color:var(--text2)}
  .mic-btn:hover{background:var(--btn-hover);color:var(--text)}
  .mic-btn.listening{background:#e53935;color:#fff;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  .typing{display:none;gap:5px;padding:14px 16px;background:var(--bot-bg);border:1px solid var(--border);border-radius:var(--radius);border-bottom-left-radius:4px;box-shadow:var(--shadow);width:fit-content;align-self:flex-start}
  .typing.show{display:flex}
  .dot{width:7px;height:7px;background:var(--text2);border-radius:50%;animation:bounce 1.2s infinite}
  .dot:nth-child(2){animation-delay:0.2s}
  .dot:nth-child(3){animation-delay:0.4s}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .welcome{text-align:center;padding:24px 16px 16px}
  .welcome-icon{font-size:3rem;margin-bottom:12px}
  .welcome h2{font-size:1.3rem;font-weight:700;margin-bottom:8px}
  .welcome p{color:var(--text2);font-size:0.9rem;line-height:1.6}
  .info-footer{text-align:center;font-size:0.7rem;color:var(--text2);padding:8px 0 4px}
  @media(max-width:480px){.logo-text p{display:none}.msg{max-width:95%}.qbtn.cat{padding:8px 14px;font-size:0.82rem}}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 36 36" fill="none">
      <circle cx="18" cy="18" r="18" fill="#3949ab"/>
      <path d="M10 26 Q14 12 18 18 Q22 24 26 10" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <circle cx="18" cy="18" r="3" fill="#7986cb"/>
    </svg>
    <div class="logo-text">
      <h1>Guía de Inmigración</h1>
      <p id="subtitle">Información para inmigrantes en España</p>
    </div>
  </div>
  <div class="header-controls">
    <div class="lang-selector">
      <button class="lang-btn active" data-lang="es" onclick="setLang('es')">ES</button>
      <button class="lang-btn" data-lang="fr" onclick="setLang('fr')">FR</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    </div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Cambiar tema">🌙</button>
  </div>
</header>
<div class="chat-wrap">
  <div class="messages" id="messages" role="log" aria-live="polite">
    <div class="typing" id="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>
</div>
<div class="input-area">
  <div class="input-wrap">
    <textarea class="input-box" id="inputBox" rows="1" placeholder="Escribe tu pregunta..." maxlength="500"></textarea>
    <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎤</button>
    <button class="send-btn" onclick="sendMsg()">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="info-footer" id="infoFooter">Guía de Inmigración · gratuito y confidencial · no almacena datos</div>
</div>
<script>
let currentLang = localStorage.getItem('lang') || 'es';
const UI = {
  es: {
    subtitle: 'Información para inmigrantes en España',

    footer: 'Guía de Inmigración · gratuito y confidencial · no almacena datos',
    welcome: '<div class="welcome"><div class="welcome-icon">🧭</div><h2>Bienvenido/a a Guía de Inmigración</h2><p>Estoy aquí para ayudarte con información sobre documentos, trabajo, salud y derechos en España.<br>Escribe tu pregunta o elige una categoría:</p></div>',
    categories: ['📄 Documentos y permisos', '💼 Trabajo y empleo', '🏥 Salud', '🆘 Ayuda urgente'],
    catIds: ['papeles', 'trabajo', 'salud', 'ayuda'],
    unknownPrefix: '🔍 No tengo esa información en mi base de datos, pero puedes buscarla aquí:',

  },
  fr: {
    subtitle: 'Informations pour les immigrants en Espagne',
    placeholder: 'Écrivez votre question...',

    welcome: '<div class="welcome"><div class="welcome-icon">🧭</div><h2>Bienvenue sur le Guide Immigration</h2><p>Je suis ici pour vous aider avec des informations sur les documents, le travail, la santé et les droits en Espagne.<br>Écrivez votre question ou choisissez une catégorie :</p></div>',
    categories: ['📄 Documents et permis', '💼 Travail et emploi', '🏥 Santé', '🆘 Aide urgente'],
    catIds: ['papeles', 'trabajo', 'salud', 'ayuda'],
    unknownPrefix: 'Je n\'ai pas cette information, mais vous pouvez la chercher ici :',

  en: {
    subtitle: 'Information for immigrants in Spain',
    placeholder: 'Type your question...',
    footer: 'Immigration Guide · free and confidential · no data stored',
    welcome: '<div class="welcome"><div class="welcome-icon">🧭</div><h2>Welcome to Immigration Guide</h2><p>I am here to help you with information about documents, work, health and rights in Spain.<br>Type your question or choose a category:</p></div>',
    categories: ['📄 Documents & permits', '💼 Work & employment', '🏥 Health', '🆘 Urgent help'],
    catIds: ['papeles', 'trabajo', 'salud', 'ayuda'],
    unknownPrefix: 'I do not have that information, but you can search here:',
    unknownGoogle: 'Search on Google', unknownIntranet: 'Immigration Portal (Ministry)', unknownPAGES: 'Public Administration Office',
    unknownAskMore: 'You can rephrase the question with more details.',
  }
};
const DB = {
  papeles: {
    es: { title: '📄 Documentos y permisos', intro: 'Información sobre los principales documentos para vivir en España:', subs: {
      nie: { label: '¿Qué es el NIE?', content: '<div class="tag">Documento</div><b>NIE — Número de Identidad de Extranjero</b><br><br>Es el número fiscal para extranjeros. Necesario para trabajar, abrir cuenta bancaria, alquilar vivienda.<br><b>Formulario EX-15</b> · Coste: ~12€<br><div class="card-links"><a class="card-link" href="https://sede.administracionespublicas.gob.es/icpplus/index.html" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>Pedir cita previa</a><a class="card-link" href="https://extranjeros.inclusion.gob.es/ficheros/Modelos_solicitudes/mod_solicitudes2/15-Formulario_NIE_y_certificados.pdf" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Descargar EX-15 (PDF)</a></div>' },
      tie: { label: '¿Qué es la TIE?', content: '<div class="tag">Documento</div><b>TIE — Tarjeta de Identidad de Extranjero</b><br><br>Tarjeta física de residencia legal. Formulario EX-17 · Coste: ~16€<br><div class="card-links"><a class="card-link" href="https://extranjeros.inclusion.gob.es/ficheros/Modelos_solicitudes/mod_solicitudes2/17-Tarjeta_de_identidad_de_extranjero.pdf" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Descargar EX-17 (PDF)</a><a class="card-link" href="https://sede.administracionespublicas.gob.es/icpplus/index.html" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>Pedir cita previa</a></div>' },
      permiso: { label: 'Permiso de trabajo', content: '<div class="tag">Permiso</div><b>Permiso de trabajo en España</b><br><br>Para trabajar legalmente necesitas autorización de residencia y trabajo.<br><br>Si estás en situación irregular: puedes regularizarte mediante el <b>Arraigo Social</b> (3 años en España + vinculación laboral).<br><div class="card-links"><a class="card-link" href="https://extranjeros.inclusion.gob.es" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>Portal Extranjeros (Ministerio)</a></div>' },
      empadron: { label: 'Empadronamiento', content: '<div class="tag">Trámite</div><b>Padrón Municipal (Empadronamiento)</b><br><br>Acredita que vives en un municipio. Es la <b>prueba de domicilio</b> más importante.<br><br>Para qué sirve: sanidad, educación, servicios sociales, arraigo.<br>Cómo: ve al Ayuntamiento con pasaporte/NIE + contrato de alquiler.<br><b>Es gratuito</b> y no piden situación regular.' },
      arraigo: { label: 'Arraigo social/laboral', content: '<div class="tag">Regularización</div><b>Arraigo — Regularización de situación irregular</b><br><br>Tipos:<br><ul><li><b>Social:</b> 3 años en España + contrato de trabajo o integración</li><li><b>Laboral:</b> 2 años + relación laboral demostrable</li><li><b>Familiar:</b> Ser padre/madre de un menor español</li></ul><br><div class="card-links"><a class="card-link" href="https://extranjeros.inclusion.gob.es" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>Portal Extranjería</a></div>' },
      costes: { label: 'Costes y tasas', content: '<div class="tag">Tasas</div><b>Costes oficiales (modelo 790)</b><br><ul><li>NIE: <b>~12€</b></li><li>TIE: <b>~16€</b></li><li>Permiso de trabajo: <b>~200–400€</b></li><li>Reagrupación: <b>~200€</b></li></ul><br><div class="card-links"><a class="card-link" href="https://sede.administracionespublicas.gob.es/pagotasas/index.htm" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>Pagar tasas online</a></div>' },
      reagrupacion: { label: 'Reagrupación familiar', content: '<div class="tag">Familia</div><b>Reagrupación Familiar</b><br><br>Con residencia legal puedes traer a cónyuge, hijos menores de 18 y ascendientes a cargo.<br>Requisito: 1 año de residencia legal.<br><br><div class="card-links"><a class="card-link" href="https://extranjeros.inclusion.gob.es/ficheros/Modelos_solicitudes/mod_solicitudes2/02-Autorización_de_residencia_por_reagrupación_familiar.pdf" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Descargar EX-02 (PDF)</a></div>' },
      derechos: { label: 'Mis derechos', content: '<div class="tag">Derechos</div><b>Derechos aunque estés en situación irregular</b><br><ul><li>🏥 Urgencias gratuitas siempre</li><li>🏫 Educación de menores (obligatoria y gratuita)</li><li>⚖️ Asistencia jurídica gratuita</li><li>🤲 Servicios sociales básicos</li><li>🚫 No pueden detenerte solo por tu aspecto</li></ul><br><div class="card-links"><a class="card-link" href="https://www.acnur.org/es-es/" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>ACNUR — ONU Refugiados</a><a class="card-link" href="https://www.cruzroja.es" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>Cruz Roja</a></div>' }
    }},
    fr: { title: '📄 Documents et permis', intro: 'Documents principaux pour vivre en Espagne :', subs: {
      nie: { label: 'Qu\'est-ce que le NIE ?', content: '<div class="tag">Document</div><b>NIE</b> — Numéro fiscal pour étrangers. Formulaire EX-15 · ~12€<br><div class="card-links"><a class="card-link" href="https://sede.administracionespublicas.gob.es/icpplus/index.html" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>Prendre rendez-vous</a></div>' },
      tie: { label: 'Carte de résidence (TIE)', content: '<div class="tag">Document</div><b>TIE</b> — Carte de résidence légale. EX-17 · ~16€' },
      permiso: { label: 'Permis de travail', content: '<div class="tag">Permis</div>Pour travailler légalement, autorisation de résidence et travail requise. Régularisation possible par <b>Arraigo Social</b> (3 ans en Espagne).' },
      empadron: { label: 'Certificat de domicile', content: '<div class="tag">Démarche</div>Le registre municipal prouve votre domicile. Gratuit à la mairie avec passeport + contrat de location.' },
      arraigo: { label: 'Régularisation (Arraigo)', content: '<div class="tag">Régularisation</div>Social: 3 ans + contrat · Laboral: 2 ans + emploi prouvé' },
      costes: { label: 'Coûts et taxes', content: '<div class="tag">Taxes</div>NIE: ~12€ · TIE: ~16€ · Permis de travail: ~200–400€' },
      reagrupacion: { label: 'Regroupement familial', content: '<div class="tag">Famille</div>Avec résidence légale, vous pouvez faire venir votre famille. EX-02.' },
      derechos: { label: 'Mes droits', content: '<div class="tag">Droits</div>Urgences gratuites · Éducation enfants · Aide juridique gratuite<br><div class="card-links"><a class="card-link" href="https://www.acnur.org" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>UNHCR Espagne</a></div>' }
    }},
    en: { title: '📄 Documents & permits', intro: 'Main documents to live in Spain:', subs: {

const city=detectCity(n);const placeType=detectPlaceType(n);if(city&&placeType){const q=encodeURIComponent(`${placeType} ${city}`);return `📍 <b>${placeType} en ${city}</b><div class="card-links"><a class="card-link" href="https://www.google.com/maps/search/${q}" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>Google Maps</a><a class="card-link" href="https://www.google.com/search?q=${q}" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>Buscar en Google</a><a class="card-link" href="https://sede.administracionespublicas.gob.es/icpplus/index.html" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>Cita previa</a></div>`;}
const stMap=SUBTOPIC_MAP[L]||SUBTOPIC_MAP.es;for(const[subKey,keywords]of Object.entries(stMap)){for(const kw of keywords){if(n.includes(norm(kw))){for(const[catKey,catData]of Object.entries(DB)){const catLang=catData[L]||catData.es;if(catLang.subs&&catLang.subs[subKey]){lastCat=catKey;return catLang.subs[subKey].content;}}}}}
const kmMap=KEYWORD_MAP[L]||KEYWORD_MAP.es;for(const[catKey,keywords]of Object.entries(kmMap)){for(const kw of keywords){if(n.includes(norm(kw))){lastCat=catKey;return showCategory(catKey);}}}
return buildUnknown(input);}
function showCategory(catKey){const L=currentLang;const catLang=DB[catKey]?.[L]||DB[catKey]?.es;if(!catLang)return buildUnknown('');lastCat=catKey;const subsHtml=Object.entries(catLang.subs).map(([k,s])=>`<button class="qbtn" onclick="subTopic('${catKey}','${k}')">${s.label}</button>`).join('');return `<b>${catLang.title}</b><br>${catLang.intro}<div class="quick-btns" style="margin-top:10px">${subsHtml}</div>`;}
function buildUnknown(input){const L=currentLang;const ui=UI[L];const q=encodeURIComponent(input+' inmigración España');return `${ui.unknownPrefix}<div class="card-links"><a class="card-link" href="https://www.google.com/search?q=${q}" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>${ui.unknownGoogle}</a><a class="card-link" href="https://extranjeros.inclusion.gob.es" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>${ui.unknownIntranet}</a><a class="card-link" href="https://sede.administracionespublicas.gob.es" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>${ui.unknownPAGES}</a></div><br><small>${ui.unknownAskMore}</small>`;}
function addMsg(role,html,withQuickBtns){const wrap=document.getElementById('messages');const typing=document.getElementById('typing');const div=document.createElement('div');div.className=`msg ${role}`;const bubble=document.createElement('div');bubble.className='bubble';bubble.innerHTML=html;div.appendChild(bubble);wrap.insertBefore(div,typing);if(withQuickBtns&&role==='bot'){const qd=document.createElement('div');qd.className='quick-btns';UI[currentLang].categories.forEach((label,i)=>{const btn=document.createElement('button');btn.className='qbtn cat';btn.textContent=label;btn.onclick=()=>catClick(UI[currentLang].catIds[i]);qd.appendChild(btn);});div.appendChild(qd);}setTimeout(()=>wrap.scrollTop=wrap.scrollHeight,50);}
function showTyping(){document.getElementById('typing').classList.add('show');const wrap=document.getElementById('messages');setTimeout(()=>wrap.scrollTop=wrap.scrollHeight,50);}
function hideTyping(){document.getElementById('typing').classList.remove('show');}
function catClick(catKey){const L=currentLang;const catLang=DB[catKey]?.[L]||DB[catKey]?.es;if(!catLang)return;addMsg('user',catLang.title);showTyping();setTimeout(()=>{hideTyping();addMsg('bot',showCategory(catKey));},500);}
function subTopic(catKey,subKey){const L=currentLang;const catLang=DB[catKey]?.[L]||DB[catKey]?.es;if(!catLang?.subs?.[subKey])return;const sub=catLang.subs[subKey];addMsg('user',sub.label);showTyping();setTimeout(()=>{hideTyping();addMsg('bot',sub.content);},500);}
async function sendMsg(){const box=document.getElementById('inputBox');const text=box.value.trim();if(!text)return;box.value='';box.style.height='';addMsg('user',escapeHtml(text));showTyping();await new Promise(r=>setTimeout(r,600+Math.random()*400));hideTyping();addMsg('bot',respond(text));}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
document.getElementById('inputBox').addEventListener('input',function(){this.style.height='';this.style.height=Math.min(this.scrollHeight,140)+'px';});
document.getElementById('inputBox').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
function toggleTheme(){const isDark=document.documentElement.getAttribute('data-theme')!=='light';const newTheme=isDark?'light':'dark';document.documentElement.setAttribute('data-theme',newTheme==='dark'?'':'light');localStorage.setItem('theme',newTheme);document.getElementById('themeBtn').textContent=newTheme==='light'?'🌙':'☀️';}
(function(){const saved=localStorage.getItem('theme');if(saved==='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('themeBtn').textContent='☀️';}})();
function setLang(lang){currentLang=lang;localStorage.setItem('lang',lang);document.querySelectorAll('.lang-btn').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);});const ui=UI[lang];document.getElementById('subtitle').textContent=ui.subtitle;document.getElementById('inputBox').placeholder=ui.placeholder;document.getElementById('infoFooter').textContent=ui.footer;const wrap=document.getElementById('messages');const typing=document.getElementById('typing');while(wrap.firstChild&&wrap.firstChild!==typing){wrap.removeChild(wrap.firstChild);}lastCat=null;showWelcome();}
function showWelcome(){const ui=UI[currentLang];addMsg('bot',ui.welcome,true);}
let recognition=null,listening=false;
function toggleVoice(){if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){alert('Tu navegador no soporta reconocimiento de voz. Usa Chrome.');return;}if(listening){recognition.stop();return;}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang=currentLang==='fr'?'fr-ES':currentLang==='en'?'en-US':'es-ES';recognition.onresult=e=>{document.getElementById('inputBox').value=e.results[0][0].transcript;};recognition.onend=()=>{listening=false;document.getElementById('micBtn').classList.remove('listening');};recognition.start();listening=true;document.getElementById('micBtn').classList.add('listening');}
document.addEventListener('DOMContentLoaded',()=>{const savedLang=localStorage.getItem('lang')||'es';setLang(savedLang);});
</script>
